<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" fill="#0B1D3A"/>
  <rect x="20" y="20" width="360" height="200" rx="8" fill="#1A2F52" stroke="#C9A84C" stroke-width="1"/>
  
  <!-- PDF document -->
  <rect x="100" y="40" width="200" height="140" rx="4" fill="#F5F5F5" stroke="#E8C97A" stroke-width="2"/>
  <rect x="110" y="50" width="180" height="10" rx="2" fill="#1A2F52" opacity="0.8"/>
  <rect x="110" y="70" width="160" height="8" rx="1" fill="#1A2F52" opacity="0.6"/>
  <rect x="110" y="85" width="170" height="8" rx="1" fill="#1A2F52" opacity="0.6"/>
  <rect x="110" y="100" width="150" height="8" rx="1" fill="#1A2F52" opacity="0.6"/>
  
  <!-- PDF icon -->
  <rect x="260" y="150" width="30" height="35" rx="2" fill="#DC2626"/>
  <text x="275" y="170" text-anchor="middle" fill="white" font-family="Arial" font-size="8" font-weight="bold">PDF</text>
  
  <!-- Step indicator -->
  <circle cx="320" cy="60" r="15" fill="#E8C97A"/>
  <text x="320" y="65" text-anchor="middle" fill="#0B1D3A" font-family="Arial" font-size="12" font-weight="bold">3</text>
  
  <!-- Download arrow -->
  <circle cx="200" cy="120" r="20" fill="#E8C97A" opacity="0.2"/>
  <path d="M200 110 L200 130 M195 125 L200 130 L205 125" stroke="#E8C97A" stroke-width="2" fill="none"/>
  
  <!-- CSV batch icon -->
  <rect x="50" y="60" width="40" height="50" rx="2" fill="#10B981" opacity="0.8"/>
  <text x="70" y="80" text-anchor="middle" fill="white" font-family="Arial" font-size="6" font-weight="bold">CSV</text>
  <rect x="55" y="90" width="30" height="2" fill="white" opacity="0.6"/>
  <rect x="55" y="95" width="25" height="2" fill="white" opacity="0.6"/>
  <rect x="55" y="100" width="28" height="2" fill="white" opacity="0.6"/>
  
  <!-- Success checkmark -->
  <circle cx="340" cy="160" r="15" fill="#4CAF50"/>
  <path d="M332 160 L338 166 L348 154" stroke="white" stroke-width="3" fill="none"/>
  
  <!-- Text labels -->
  <text x="100" y="200" fill="#E8C97A" font-family="Arial" font-size="11">Download PDF or Batch CSV</text>
  <text x="100" y="215" fill="#C9A84C" font-family="Arial" font-size="9" opacity="0.7">Ready for submission</text>
</svg>
