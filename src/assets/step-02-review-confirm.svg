<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" fill="#0B1D3A"/>
  <rect x="20" y="20" width="360" height="200" rx="8" fill="#1A2F52" stroke="#C9A84C" stroke-width="1"/>
  
  <!-- Receipt preview -->
  <rect x="40" y="40" width="320" height="160" rx="4" fill="#0B1D3A" stroke="#E8C97A" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Header -->
  <rect x="50" y="50" width="300" height="20" rx="2" fill="#E8C97A" opacity="0.6"/>
  <text x="200" y="64" text-anchor="middle" fill="#0B1D3A" font-family="Arial" font-size="10" font-weight="bold">FCT-IRS RENT RECEIPT</text>
  
  <!-- Content lines -->
  <rect x="50" y="80" width="120" height="8" rx="1" fill="#C9A84C" opacity="0.4"/>
  <rect x="180" y="80" width="80" height="8" rx="1" fill="#E8C97A" opacity="0.6"/>
  <rect x="50" y="95" width="100" height="8" rx="1" fill="#C9A84C" opacity="0.4"/>
  <rect x="180" y="95" width="90" height="8" rx="1" fill="#E8C97A" opacity="0.6"/>
  
  <!-- Step indicator -->
  <circle cx="320" cy="60" r="15" fill="#E8C97A"/>
  <text x="320" y="65" text-anchor="middle" fill="#0B1D3A" font-family="Arial" font-size="12" font-weight="bold">2</text>
  
  <!-- Edit cursor -->
  <rect x="250" y="110" width="40" height="12" rx="2" fill="#E8C97A" opacity="0.3" stroke="#E8C97A" stroke-width="1"/>
  <line x1="295" y1="116" x2="305" y2="116" stroke="#E8C97A" stroke-width="2"/>
  
  <!-- Magnifying glass -->
  <circle cx="80" cy="150" r="12" fill="none" stroke="#E8C97A" stroke-width="2"/>
  <line x1="89" y1="159" x2="95" y2="165" stroke="#E8C97A" stroke-width="2"/>
  
  <!-- Text labels -->
  <text x="50" y="175" fill="#E8C97A" font-family="Arial" font-size="11">Review & Edit</text>
  <text x="50" y="190" fill="#C9A84C" font-family="Arial" font-size="9" opacity="0.7">Click any section to edit</text>
</svg>
